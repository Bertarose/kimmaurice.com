<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Ces derniers souffles</title>
<style>
  :root{--fond:#0b0b0a;--texte:#e8e6e0;--doux:#9a978f;--ligne:#2c2b28;color-scheme:dark}
  html,body{margin:0;height:100%;background:var(--fond);color:var(--texte)}
  body{display:grid;place-items:center;font:400 16px/1.5 ui-monospace,Menlo,monospace;
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  main{max-width:34rem;width:100%}
  h1{font:300 clamp(28px,6vw,44px)/1.1 Georgia,'Times New Roman',serif;margin:0 0 6px;text-wrap:balance}
  p{color:var(--doux);margin:0 0 28px;font-size:14px}
  a{display:flex;justify-content:space-between;gap:16px;padding:16px 0;border-top:1px solid var(--ligne);color:var(--texte);text-decoration:none}
  a:last-child{border-bottom:1px solid var(--ligne)}
  a span{color:var(--doux);font-size:13px;text-align:right}
  a:hover,a:focus-visible{color:#fff;outline:none}
  a:focus-visible{text-decoration:underline}
</style>
</head>
<body>
<main>
  <h1>Ces derniers souffles</h1>
  <p>Photographies de Mathilde · conception et code de Kim Maurice</p>
  <a href="v1/">v1 <span>brise douce</span></a>
  <a href="v2/">v2 <span>vent vivant · souffle au micro</span></a>
</main>
</body>
</html>
