<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kim Maurice | Site en construction</title>
    <style>
        /* TON STYLE DARK MODE & NÉON */
        :root {
            --bg: #0a0a1f;
            --text: #FFFEF9;
            --neon: #39ff14;
            --grey: #8b9bb4;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .container {
            padding: 2rem;
            max-width: 600px;
        }

        h1 {
            font-size: 3rem;
            font-weight: 300;
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        p {
            font-size: 1.1rem;
            color: var(--grey);
            margin-bottom: 2rem;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid var(--neon);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 2rem auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .btn {
            display: inline-block;
            padding: 10px 25px;
            border: 1px solid var(--neon);
            color: var(--neon);
            text-decoration: none;
            border-radius: 30px;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .btn:hover {
            background: var(--neon);
            color: var(--bg);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="loader"></div>

        <h1>Travaux en cours</h1>
        
        <p>
            Je travaille actuellement sur la refonte de mon portfolio.<br>
            Le nouveau site sera en ligne très bientôt avec mes derniers projets interactifs et IA.
        </p>

        <a href="mailto:info@kimmaurice.com" class="btn">Me contacter par email</a>
    </div>

</body>
</html>
