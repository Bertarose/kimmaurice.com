<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kim Maurice | Technologue créative · Montréal</title>
  <meta name="description" content="Kim Maurice — technologue créative, designer multimédia, Montréal.">
  <link rel="icon" type="image/x-icon" href="img/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500;600;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-WYM83ME5LK"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-WYM83ME5LK',{anonymize_ip:true});</script>
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100%; height:100%;
  overflow:hidden;
  font-family:'DM Mono', monospace;
  background:#000;
  -webkit-font-smoothing:antialiased;
}
a { text-decoration:none; color:inherit; }

/* BACKGROUND */
#bg { position:fixed; inset:0; z-index:0; }
#bg-img {
  position:absolute; inset:0;
  width:100%; height:100%;
  object-fit:cover; object-position:center 20%;
  display:block;
}
#bg-stream {
  position:absolute; inset:0;
  width:100%; height:100%;
  border:none; display:none;
  pointer-events:none;
  /* hack YouTube/Twitch pour couvrir tout l'écran */
  transform:scale(1.05);
}

/* OVERLAY gradient */
#overlay {
  position:fixed; inset:0; z-index:1;
  background:
    linear-gradient(
      180deg,
      rgba(4,2,14,.5)   0%,
      rgba(4,2,14,.18)  35%,
      rgba(4,2,14,.52)  70%,
      rgba(4,2,14,.92)  100%
    );
}

/* GRAIN canvas */
#grain-canvas {
  position:fixed; inset:0; z-index:2;
  pointer-events:none;
  opacity:.5;
  mix-blend-mode:overlay;
}

/* UI layer */
.ui {
  position:fixed; inset:0; z-index:3;
  display:flex; flex-direction:column;
  justify-content:space-between;
  padding:1.75rem;
}
@media(min-width:768px) { .ui { padding:2.5rem; } }

/* top */
.top { display:flex; justify-content:space-between; align-items:flex-start; }
.logo-img { width:32px; height:32px; object-fit:contain; opacity:.85; transition:opacity .2s; }
.logo-img:hover { opacity:1; }
.top-right { display:flex; align-items:center; gap:.6rem; }

.lang-btn {
  font-family:'DM Mono', monospace;
  font-size:.55rem; letter-spacing:.16em; text-transform:uppercase;
  color:rgba(255,255,255,.52); background:transparent;
  border:1px solid rgba(255,255,255,.18);
  padding:.32rem .58rem; cursor:pointer;
  transition:color .2s, border-color .2s;
}
.lang-btn:hover { color:#fff; border-color:rgba(255,255,255,.5); }

.live-badge {
  display:none;
  font-family:'DM Mono', monospace;
  font-size:.52rem; letter-spacing:.18em; text-transform:uppercase;
  color:#ff3b30; border:1px solid rgba(255,59,48,.4);
  padding:.32rem .68rem;
  align-items:center; gap:.4rem;
}
.live-badge.visible { display:flex; }
.live-dot {
  width:5px; height:5px; border-radius:50%; background:#ff3b30;
  animation:livepulse 1.2s ease-in-out infinite;
}
@keyframes livepulse { 0%,100%{opacity:1} 50%{opacity:.25} }

/* center — title */
.center {
  flex:1; display:flex; align-items:flex-end;
  padding-bottom:.5rem;
}
.title-block { max-width:680px; }

.kicker {
  font-family:'DM Mono', monospace;
  font-size:.54rem; letter-spacing:.24em; text-transform:uppercase;
  color:rgba(255,255,255,.45); margin-bottom:1rem;
  display:flex; align-items:center; gap:.7rem;
}
.kicker::before {
  content:''; display:block; width:20px; height:1px;
  background:rgba(255,255,255,.35);
}

h1 {
  font-family:'Barlow Condensed', sans-serif;
  font-weight:300;
  font-size:clamp(2.6rem, 5.8vw, 6.2rem);
  line-height:.88;
  letter-spacing:-.01em;
  color:rgba(255,255,255,.9);
}

/* bottom */
.bottom { display:flex; justify-content:space-between; align-items:flex-end; }

.bottom-left {
  font-family:'DM Mono', monospace;
  font-size:.52rem; letter-spacing:.12em; text-transform:uppercase;
  color:rgba(255,255,255,.28); line-height:1.9;
}

/* enter button */
.enter-link {
  display:flex; align-items:center; gap:1rem;
  font-family:'DM Mono', monospace;
  font-size:.6rem; letter-spacing:.22em; text-transform:uppercase;
  color:rgba(255,255,255,.65);
  cursor:pointer; transition:color .25s;
  user-select:none;
}
.enter-link:hover { color:#fff; }
.enter-link:hover .enter-line { width:52px; background:#fff; }
.enter-link:hover .enter-line::after { border-color:#fff; }

.enter-line {
  display:inline-block; width:38px; height:1px;
  background:rgba(255,255,255,.5);
  position:relative;
  transition:width .3s ease, background .25s;
}
.enter-line::after {
  content:'';
  position:absolute; right:-1px; top:-3px;
  width:7px; height:7px;
  border-top:1px solid rgba(255,255,255,.5);
  border-right:1px solid rgba(255,255,255,.5);
  transform:rotate(45deg);
  transition:border-color .25s;
}

/* fade out on enter */
body.fade-out {
  opacity:0;
  transition:opacity .4s ease;
}
</style>
</head>
<body>

<script>
  /*
   * ── CONFIGURATION ──────────────────────────────
   *
   * STREAM_URL = null        → affiche img.jpg
   *
   * Pour activer ton stream, remplace null par l'URL :
   *
   * Twitch  → 'https://player.twitch.tv/?channel=TON_CHANNEL&parent=kimmaurice.com&autoplay=true&muted=true'
   * YouTube → 'https://www.youtube.com/embed/LIVE_ID?autoplay=1&mute=1'
   *
   * ───────────────────────────────────────────────
   */
  const STREAM_URL = null;
</script>

<div id="bg">
  <img id="bg-img" src="img/img.jpg" alt="">
  <iframe id="bg-stream" allow="autoplay; fullscreen" allowfullscreen></iframe>
</div>

<div id="overlay"></div>
<canvas id="grain-canvas"></canvas>

<div class="ui">

  <div class="top">
    <a href="index.html">
      <img src="img/logo-light.png" alt="Kim Maurice" class="logo-img" width="32" height="32">
    </a>
    <div class="top-right">
      <div class="live-badge" id="liveBadge"><span class="live-dot"></span><span>Live</span></div>
      <button class="lang-btn" id="langBtn">EN</button>
    </div>
  </div>

  <div class="center">
    <div class="title-block">
      <p class="kicker" data-fr="Montréal · Tiohtiá:ke" data-en="Montréal · Tiohtiá:ke">Montréal · Tiohtiá:ke</p>
      <h1 data-fr="Technologue<br>créative —<br>multimédia,<br>son & image" data-en="Creative<br>Technologist —<br>multimedia,<br>sound & image">Technologue<br>créative —<br>multimédia,<br>son & image</h1>
    </div>
  </div>

  <div class="bottom">
    <div class="bottom-left">
      <div>Kim Maurice</div>
      <div>© 2025</div>
    </div>
    <a href="cv.html" class="enter-link" id="enterLink">
      <span data-fr="Entrer" data-en="Enter">Entrer</span>
      <span class="enter-line"></span>
    </a>
  </div>

</div>

<script>
// GRAIN
(function() {
  const canvas = document.getElementById('grain-canvas');
  const ctx    = canvas.getContext('2d');
  let W, H, id;

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function tick() {
    const img  = ctx.createImageData(W, H);
    const data = img.data;
    for (let i = 0; i < data.length; i += 4) {
      const v     = Math.random() * 255 | 0;
      data[i]     = v;
      data[i + 1] = v;
      data[i + 2] = v;
      data[i + 3] = (Math.random() * 38) | 0;
    }
    ctx.putImageData(img, 0, 0);
    id = requestAnimationFrame(tick);
  }

  window.addEventListener('resize', () => { cancelAnimationFrame(id); resize(); tick(); });
  resize(); tick();
})();

// STREAM vs IMAGE
(function() {
  if (!STREAM_URL) return;
  document.getElementById('bg-img').style.display    = 'none';
  const stream = document.getElementById('bg-stream');
  stream.style.display = 'block';
  stream.src           = STREAM_URL;
  document.getElementById('liveBadge').classList.add('visible');
})();


// ENTER — fade out
document.getElementById('enterLink').addEventListener('click', function(e) {
  e.preventDefault();
  document.body.classList.add('fade-out');
  setTimeout(() => { window.location.href = 'cv.html'; }, 380);
});
</script>
<script src="script.js"></script>
</body>
</html>
